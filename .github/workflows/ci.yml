name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  ci:
    name: Gatekeeper
    uses: Florencea/vp-actions/.github/workflows/vp-web-ci.yml@v2.0.0
    with:
      enable-platform-compat: true
