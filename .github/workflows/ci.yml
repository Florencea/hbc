name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  CI: "true"
  NO_COLOR: "1"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  gatekeeper:
    name: Tier 1 Gatekeeper (Linux / Strict Engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: package.json
          cache: true
          cache-toolchain: true

      - name: Install dependencies
        run: vp install

      - name: Cache Vite+ task cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-${{ hashFiles('package.json', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-${{ hashFiles('package.json', 'vite.config.ts') }}-
            ${{ runner.os }}-vite-task-

      - name: Run inner loop verification (Oxlint & Oxfmt & Tailwind)
        run: vp run agent:verify:inner

      - name: Run dead code and unused export check (Knip)
        run: vp run check:deadcode

      - name: Run unit test suite
        run: vp run agent:test:unit

      - name: Build production bundle
        run: vp build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(vp exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Setup test environment (install browser)
        run: vp run test:setup

      - name: Install Playwright system dependencies on Linux
        run: vp exec playwright install-deps chromium

      - name: Run Playwright E2E smoke tests
        run: vp run agent:test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ubuntu-latest
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  platform-compat:
    name: Tier 2 Platform Compat (${{ matrix.os }})
    needs: [gatekeeper]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: package.json
          cache: true
          cache-toolchain: true

      - name: Install dependencies
        run: vp install

      - name: Build production bundle
        run: vp build

      - name: Run unit test suite
        run: vp run agent:test:unit
