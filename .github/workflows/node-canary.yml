name: Node.js Canary

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CI: "true"
  NO_COLOR: "1"

permissions:
  contents: read

jobs:
  canary:
    name: Upstream Node Canary (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (Bypass Engine Strict)
        run: npm ci --engine-strict=false
        env:
          NPM_CONFIG_ENGINE_STRICT: "false"

      - name: Build production bundle
        continue-on-error: true
        run: npm run build

      - name: Run unit test suite
        continue-on-error: true
        run: npm run agent:test:unit
