name: Node.js Canary

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CI: "true"
  NO_COLOR: "1"

permissions:
  contents: read

jobs:
  canary:
    name: Upstream Node Canary (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+ with Node ${{ matrix.node-version }}
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build production bundle
        continue-on-error: true
        run: vp build

      - name: Run unit test suite
        continue-on-error: true
        run: vp run agent:test:unit
